<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack — Gerenciador de Treinos</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header>
    <h1>🏋️ FitTrack</h1>
    <p>Gerenciador de Treinos e Exercícios Diários</p>
    <nav>
      <ul>
        <li><a href="#cadastro">Cadastrar Treino</a></li>
        <li><a href="#listagem">Meus Treinos</a></li>
        <li><a href="#detalhes">Detalhes</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main id="conteudo-principal">

    <!-- Seção: Formulário de Cadastro de Treino -->
    <section id="cadastro">
      <h2>Nova Ficha de Treino</h2>
      <form action="#" method="POST">
        
        <p>
          <label for="nome-treino">Nome do Treino / Grupo Muscular:</label>
          <input type="text" id="nome-treino" name="nome-treino" placeholder="Ex: Treino A - Peito e Tríceps" required>
        </p>

        <p>
          <label for="categoria">Categoria:</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecione...</option>
            <option value="hipertrofia">Musculação / Hipertrofia</option>
            <option value="cardio">Cardio / Corrida</option>
            <option value="funcional">Treino Funcional</option>
            <option value="mobilidade">Mobilidade / Alongamento</option>
          </select>
        </p>

        <p>
          <label for="dia-semana">Dia da Semana:</label>
          <select id="dia-semana" name="dia-semana" required>
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
          </select>
        </p>

        <p>
          <label for="duracao">Duração Estimada (minutos):</label>
          <input type="number" id="duracao" name="duracao" min="10" max="180" placeholder="Ex: 50" required>
        </p>

        <p>
          <label for="observacoes">Lista de Exercícios / Observações:</label>
          <textarea id="observacoes" name="observacoes" rows="4" placeholder="Ex: Supino reto 4x10, Tríceps corda 3x12..."></textarea>
        </p>

        <p>
          <button type="submit">Cadastrar Treino</button>
        </p>

      </form>
    </section>

  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2026 FitTrack — Trabalho Prático DIW (PUC Minas)</p>
  </footer>

</body>
</html>
